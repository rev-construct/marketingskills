name: Check hidden content

on:
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - "tools/**"
      - "scripts/check-hidden-content.mjs"
      - "scripts/hidden-content-allowlist.json"

permissions:
  contents: read

jobs:
  hidden-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan skills and tools for hidden content
        run: node scripts/check-hidden-content.mjs
